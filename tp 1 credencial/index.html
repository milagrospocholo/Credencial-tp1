<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credencial Digital - Milagros</title>

    <!-- Tipografía manuscrita desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Contenedor principal del afiche / credencial -->
    <main class="tarjeta">

        <!-- 1. Cartel superior izquierdo -->
        <div class="bloque-fiesta">
            <img src="fiesta.png" alt="Hagamos una fiesta de los 2000s" class="sticker-fiesta">
        </div>

        <!-- 2. Título principal: Tu nombre (abajo a la izquierda) -->
        <h1 class="titulo-nombre">
            <img src="Milagros.png" alt="Milagros pocholo">
        </h1>

        <!-- 3. Labios fucsias debajo de tu nombre -->
        <img src="labios.png" alt="Labios fucsias" class="sticker-labios">

        <!-- 4. Texto de fecha e invitación (espacio libre inferior izquierdo) -->
        <p class="texto-invitacion">20/10 veni a disfrutar de la mejor fiesta</p>

        <!-- 5. Britney Spears con la serpiente (Centro) -->
        <img src="britney.png" alt="Britney Spears con la serpiente en los VMAs" class="sticker-britney">

        <!-- 6. Celular Razr (Arriba a la derecha) -->
        <img src="celular.png" alt="Celular rosa de los 2000s" class="sticker-celular">

        <!-- 7. Tu foto con la torta (Abajo a la derecha) -->
        <img src="yo.png" alt="Milagros celebrando sus 25 años" class="foto-principal">

    </main>

</body>
</html>
